{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method='post'>
    {% csrf_token %}
    {{ form.as_p }}
    <button class='btn' type='submit'>Login</button>
</form>
<p><a href='{% url "accounts:signup" %}'>Don’t have account? Sign up</a></p>
{% endblock %}
