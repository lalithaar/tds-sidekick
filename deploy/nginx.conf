# TDS Sidekick nginx site (HTTP only — TLS is terminated by the platform
# proxy in front of this box; keep X-Forwarded-Proto from that proxy).
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
server {
    listen 80;
    server_name YOUR.DOMAIN;

    client_max_body_size 10m;

    location /static/ {
        alias /srv/tds-sidekick/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }
}